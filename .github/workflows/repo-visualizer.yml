name: Generate Repo Diagram
on:
  push:
    branches:
      - main

jobs:
  update_diagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Update diagram
        uses: githubocto/repo-visualizer@0.7.1
        with:
          output_file: "diagram.svg"
          excluded_paths: "dist,node_modules,.codesight,.husky"
          file_colors: '{"js": "red", "ts": "green"}'